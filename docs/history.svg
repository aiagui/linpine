<text class="note" x="16" y="252">Seed 1, all 15 operations (w = write, r = read). Red: the read the checker cannot place.</text>
<text class="note" x="16" y="270">It starts at 7, after w 104 returned at 5, yet returns 944.</text>
<text class="note" x="16" y="288">Reads that start exactly at 5 overlap that write (equal timestamps overlap), so they may go first.</text>
</svg>
