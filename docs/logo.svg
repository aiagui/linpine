<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200" role="img" aria-labelledby="t">
  <title id="t">linpine</title>
  <style>
    .bar { fill: #2f9e6e; }
    .bar.b { fill: #3fb68a; }
    .bar.c { fill: #1f7a55; }
    .tick { stroke: #8a9a91; stroke-width: 2; stroke-linecap: round; }
    .trunk { fill: #b07a4f; }
    .word { fill: #1b2b24; font: 600 76px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: -2px; }
    .sub { fill: #5f6f67; font: 400 19px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .hit { fill: #e0574f; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #e8f1ec; }
      .sub { fill: #9fb0a7; }
      .tick { stroke: #5d6b64; }
    }
  </style>
  <!-- A pine drawn as overlapping operation intervals on a timeline. -->
  <g transform="translate(40 22)">
    <line class="tick" x1="70" y1="0" x2="70" y2="156" stroke-dasharray="2 7"/>
    <rect class="bar"   x="58"  y="4"   width="24"  height="12" rx="6"/>
    <rect class="bar b" x="46"  y="22"  width="40"  height="12" rx="6"/>
    <rect class="bar c" x="54"  y="40"  width="44"  height="12" rx="6"/>
    <rect class="bar"   x="34"  y="58"  width="62"  height="12" rx="6"/>
    <rect class="bar b" x="44"  y="76"  width="70"  height="12" rx="6"/>
    <rect class="bar c" x="22"  y="94"  width="84"  height="12" rx="6"/>
    <rect class="bar"   x="30"  y="112" width="94"  height="12" rx="6"/>
    <rect class="bar hit" x="10" y="130" width="54" height="12" rx="6"/>
    <rect class="bar b" x="70"  y="130" width="62"  height="12" rx="6"/>
    <rect class="trunk" x="62"  y="146" width="16"  height="12" rx="3"/>
  </g>
  <text class="word" x="200" y="112">linpine</text>
  <text class="sub" x="204" y="148">linearizability checking for TypeScript</text>
</svg>
